<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام المتابعة Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a535c; --bg: #f7fff7; --card-bg: #ffffff; --text: #333333; }
        body.dark-mode { --primary: #4ecdc4; --bg: #1a1a1a; --card-bg: #2d2d2d; --text: #f0f0f0; }
        body { background-color: var(--bg ); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; transition: 0.3s; user-select: none; }
        .container { max-width: 800px; margin-top: 20px; padding-bottom: 50px; }
        .card { background-color: var(--card-bg); color: var(--text); border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .nav-pills .nav-link { cursor: pointer; font-weight: bold; color: var(--primary); border-radius: 25px; }
        .nav-pills .nav-link.active { background-color: var(--primary) !important; color: white !important; }
        .room-card { cursor: pointer; background: var(--card-bg); text-align: center; padding: 20px; border-radius: 15px; border: 1px solid #44444433; transition: 0.2s; }
        .room-card:active { transform: scale(0.95); background: var(--primary); color: white; }
        .bg-header { background: linear-gradient(135deg, #1a535c, #4ecdc4); color: white; border-radius: 15px; }
        .student-done { background-color: #19875422 !important; }
        .d-none { display: none !important; }
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        .form-control, .form-select { background-color: var(--card-bg); color: var(--text); border-color: #44444433; border-radius: 10px; }

    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner-border text-primary mb-3"></div>
    <h5>جاري تشغيل النظام الذكي...</h5>
</div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0" style="color: var(--primary);">🕌 المتابعة Pro</h3>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="toggleDarkMode()">🌙 الوضع الليلي</button>
    </div>
    
    <ul class="nav nav-pills mb-4 justify-content-center bg-white p-2 rounded-pill shadow-sm">
        <li class="nav-item"><a class="nav-link active" id="btn-rooms" onclick="switchTab('rooms')">🏠 الجولات</a></li>
        <li class="nav-item"><a class="nav-link" id="btn-khawatir" onclick="switchTab('khawatir')">🎤 الخواطر</a></li>
        <li class="nav-item">
    <a class="nav-link bg-warning text-dark ms-2" href="reports.html" target="_blank">🚀 تقارير متقدمة</a>
</li>

        <li class="nav-item"><a class="nav-link" id="btn-manage" onclick="switchTab('manage')">⚙️ الإدارة</a></li>
    </ul>

    <!-- الجولات -->
    <div id="view-rooms" class="content-view">
        <div class="card p-4 mb-4 bg-header shadow">
            <div class="row g-2 align-items-center">
                <div class="col-6"><h6>وقت الصلاة:</h6></div>
                <div class="col-6"><select id="prayerSelect" class="form-select form-select-sm"></select></div>
                <div class="col-12 mt-2"><input type="text" id="roomSearch" class="form-control form-control-sm" placeholder="🔍 بحث عن غرفة..." onkeyup="filterRooms()"></div>
            </div>
        </div>
        <div id="roomsGrid" class="row g-3"></div>
        <div id="attendanceDetail" class="mt-4 d-none">
            <div class="card p-4">
                <div class="d-flex justify-content-between mb-3">
                    <h5 id="roomTitle" class="fw-bold text-primary"></h5>
                    <button class="btn btn-sm btn-light border rounded-pill" onclick="closeSubView('rooms')">إغلاق</button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr class="small text-muted"><th>الطالب</th><th>الحالة</th><th>ملاحظة</th></tr></thead>
                        <tbody id="attendanceList"></tbody>
                    </table>
                </div>
                <button class="btn btn-primary w-100 py-3 rounded-4 fw-bold mt-2 shadow" onclick="savePrayerAttendance()">💾 حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <!-- الخواطر -->
    <div id="view-khawatir" class="content-view d-none">
        <div class="card p-4 mb-4 text-white shadow-sm" style="background: linear-gradient(135deg, #6a11cb, #2575fc);">
            <h6 class="m-0">🎤 إدارة تكاليف الخواطر</h6>
        </div>
        <div id="khawatirRoomsGrid" class="row g-3"></div>
        <div id="khawatirDetail" class="mt-4 d-none">
            <div class="card p-4">
                <div class="d-flex justify-content-between mb-3">
                    <h5 id="khawatirRoomTitle" class="fw-bold" style="color: #6a11cb;"></h5>
                    <button class="btn btn-sm btn-light border rounded-pill" onclick="closeSubView('khawatir')">إغلاق</button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr class="small text-muted"><th>الطالب</th><th>التكليف</th><th>الحالة</th><th>إجراء</th></tr></thead>
                        <tbody id="khawatirList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- التقارير -->
    <div id="view-reports" class="content-view d-none">
        <div class="card p-4 mb-4 shadow-sm">
            <h6 class="fw-bold mb-3">📈 إحصائيات الحضور</h6>
            <div style="height: 200px;"><canvas id="statsChart"></canvas></div>
        </div>
        <div class="card p-4 shadow-sm">
            <div class="row g-2 mb-3">
                <div class="col-6"><select id="repTarget" class="form-select" onchange="toggleRepName()"><option value="all">الكل</option><option value="one">طالب</option></select></div>
                <div class="col-6"><select id="repPeriod" class="form-select"><option value="today">اليوم</option><option value="week">أسبوع</option></select></div>
                <div id="repNameDiv" class="col-12 d-none"><input type="text" id="repName" class="form-control" placeholder="اسم الطالب..."></div>
            </div>
            <button class="btn btn-info w-100 text-white fw-bold rounded-pill" onclick="generateFullReport()">🚀 عرض التقرير</button>
            <div id="repArea" class="mt-4 d-none">
                <button class="btn btn-dark btn-sm mb-3 rounded-pill px-3" onclick="copyToClipboard()">📋 نسخ للواتساب</button>
                <div id="repTable"></div>
            </div>
        </div>
    </div>

    <!-- الإدارة -->
    <div id="view-manage" class="content-view d-none">
        <div class="card p-4 mb-3 shadow-sm">
            <h6 class="fw-bold mb-3">💾 النسخ الاحتياطي</h6>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm flex-grow-1 rounded-pill" onclick="exportBackup()">📥 تصدير</button>
                <button class="btn btn-outline-warning btn-sm flex-grow-1 rounded-pill" onclick="document.getElementById('importFile').click()">📤 استيراد</button>
                <input type="file" id="importFile" class="d-none" onchange="importBackup(this)">
            </div>
        </div>
        <div class="card p-4 mb-3 shadow-sm">
            <h6 class="fw-bold mb-3">➕ إضافة طالب</h6>
            <div class="row g-2">
                <div class="col-7"><input type="text" id="mName" class="form-control" placeholder="الاسم"></div>
                <div class="col-5"><input type="text" id="mRoom" class="form-control" placeholder="الغرفة"></div>
                <button class="btn btn-success w-100 mt-2 fw-bold rounded-pill" onclick="addNewStudent()">إضافة</button>
            </div>
        </div>
        <div class="card p-4 shadow-sm">
            <input type="text" id="mSearch" class="form-control mb-3 rounded-pill" placeholder="بحث..." onkeyup="renderManageList()">
            <div id="mList"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
